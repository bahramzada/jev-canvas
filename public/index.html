<!doctype html>
<html lang="az">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>JEV CANVAS — ehtimalla çəkən plotter</title>
<link rel="stylesheet" href="style.css">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><rect width='16' height='16' fill='%23f3efe4'/><circle cx='8' cy='8' r='4' fill='none' stroke='%2316150f'/></svg>">
</head>
<body>

<header class="masthead">
  <div class="masthead-left">
    <h1>JEV&nbsp;CANVAS</h1>
    <p class="strap">TypeSafe System&nbsp;One · rəsmi ehtimal çəkir</p>
  </div>
  <div class="masthead-right">
    <span class="stamp" id="stamp">hazır</span>
  </div>
</header>

<section class="console">
  <div class="field">
    <label for="subject">MÖVZU</label>
    <input id="subject" type="text" autocomplete="off" spellcheck="false"
           value="dağların arxasından doğan günəş, qabaqda tək bir ev"
           placeholder="nə çəkilsin?">
  </div>

  <div class="rowline">
    <div class="group">
      <span class="grouplabel">REJİMLƏR</span>
      <div class="chips" id="modes">
        <label class="chip"><input type="checkbox" value="cell" checked><span>Xana <em>16×15</em></span></label>
        <label class="chip"><input type="checkbox" value="field" checked><span>Sahə <em>24×24</em></span></label>
        <label class="chip"><input type="checkbox" value="vector" checked><span>Vektor <em>960px</em></span></label>
      </div>
    </div>

    <div class="group">
      <span class="grouplabel">MÜRƏKKƏB</span>
      <div class="chips" id="ink">
        <label class="chip radio"><input type="radio" name="ink" value="bw" checked><span>Ağ-qara</span></label>
        <label class="chip radio"><input type="radio" name="ink" value="color"><span>JEV seçir</span></label>
      </div>
    </div>

    <div class="group actions">
      <button id="live" class="btn primary">Canlı çək</button>
      <button id="fast" class="btn">Tez çək</button>
      <button id="stop" class="btn ghost" disabled>Dayandır</button>
    </div>
  </div>
</section>

<main id="sheets" class="sheets"></main>

<footer class="readout" id="readout">
  <span><b id="m-calls">0</b> çağırış</span>
  <span><b id="m-q">0</b> sual</span>
  <span><b id="m-tok">0</b> token</span>
  <span><b id="m-cost">$0.0000</b></span>
  <span><b id="m-med">0</b> ms median</span>
  <span class="spacer"></span>
  <span class="muted">jev-latest · input $0.042/1M · output pulsuz</span>
</footer>

<template id="sheet-tpl">
  <article class="sheet">
    <div class="sheet-head">
      <h2 class="sheet-name"></h2>
      <span class="sheet-grid"></span>
    </div>
    <p class="sheet-note"></p>
    <div class="paper">
      <canvas class="layer under"></canvas>
      <canvas class="layer ink"></canvas>
      <span class="reg tl"></span><span class="reg tr"></span>
      <span class="reg bl"></span><span class="reg br"></span>
      <div class="working"><span></span></div>
    </div>
    <div class="sheet-foot">
      <span class="sf-lat">—</span>
      <span class="sf-call">—</span>
      <span class="sf-cost">—</span>
    </div>
    <ol class="log"></ol>
  </article>
</template>

<script type="module" src="app.js"></script>
</body>
</html>
