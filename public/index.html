<!doctype html>
<html lang="az">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>JEV CANVAS — dərinlik sahəsindən piksel art</title>
<link rel="stylesheet" href="style.css">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 8 8'><rect width='8' height='8' fill='%23f5f1e6'/><rect x='2' y='1' width='4' height='1' fill='%231b1a16'/><rect x='1' y='2' width='6' height='4' fill='%231b1a16'/><rect x='2' y='6' width='4' height='1' fill='%231b1a16'/></svg>">
</head>
<body>

<header class="masthead">
  <div class="masthead-left">
    <h1>JEV&nbsp;CANVAS</h1>
    <p class="strap">Hər piksel bir <code>score</code> sualıdır — «nə qədər dərindəsən?»</p>
  </div>
  <span class="stamp" id="stamp">hazır</span>
</header>

<section class="console">
  <div class="field">
    <label for="subject">MÖVZU</label>
    <input id="subject" type="text" autocomplete="off" spellcheck="false"
           value="green apple with a leaf" placeholder="nə çəkilsin?">
  </div>

  <div class="rowline">
    <div class="group">
      <span class="grouplabel">ÖLÇÜLƏR</span>
      <div class="chips" id="modes">
        <label class="chip"><input type="checkbox" value="16" checked><span>16×16 <em>256 score</em></span></label>
        <label class="chip"><input type="checkbox" value="32" checked><span>32×32 <em>1024 score</em></span></label>
        <label class="chip"><input type="checkbox" value="64" checked><span>64×64 <em>32-dən böyüdülür</em></span></label>
      </div>
    </div>

    <div class="group">
      <span class="grouplabel">RƏNG</span>
      <div class="chips" id="ink">
        <label class="chip radio"><input type="radio" name="ink" value="bw" checked><span>1-bit</span></label>
        <label class="chip radio"><input type="radio" name="ink" value="color"><span>JEV seçir</span></label>
      </div>
    </div>

    <div class="group actions">
      <button id="live" class="btn primary">Canlı çək</button>
      <button id="fast" class="btn">Tez çək</button>
      <button id="stop" class="btn ghost" disabled>Dayandır</button>
    </div>
  </div>
</section>

<main id="sheets" class="sheets"></main>

<footer class="readout">
  <span><b id="m-calls">0</b> çağırış</span>
  <span><b id="m-q">0</b> sual</span>
  <span><b id="m-tok">0</b> token</span>
  <span><b id="m-cost">$0.0000</b></span>
  <span><b id="m-med">0</b> ms median</span>
  <span class="spacer"></span>
  <span class="muted">jev-latest · input $0.042/1M · output pulsuz</span>
</footer>

<template id="sheet-tpl">
  <article class="sheet">
    <div class="sheet-head">
      <h2 class="sheet-name"></h2>
      <span class="sheet-grid"></span>
    </div>
    <p class="sheet-note"></p>
    <div class="paper">
      <canvas class="layer under"></canvas>
      <canvas class="layer ink"></canvas>
      <div class="working"><span></span></div>
    </div>
    <div class="sheet-foot">
      <span class="sf-lat">—</span>
      <span class="sf-call">—</span>
      <a class="sf-dl" href="#" download hidden>PNG</a>
      <span class="sf-cost">—</span>
    </div>
    <ol class="log"></ol>
  </article>
</template>

<script type="module" src="app.js"></script>
</body>
</html>
